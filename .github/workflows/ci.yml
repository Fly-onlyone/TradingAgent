name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check backend/

      - name: Ruff format check
        run: uv run ruff format --check backend/

      - name: mypy
        run: uv run mypy backend/app
        continue-on-error: true

      - name: Run tests
        run: uv run pytest --tb=short -q
        env:
          DEBUG: "true"

  frontend:
    name: Frontend — Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

  desktop:
    name: Desktop — Build, Test & Publish
    # Windows: the app is Windows-first and Native AOT cannot cross-compile from Linux.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore TradingAgent.slnx --locked-mode

      - name: Format check
        run: dotnet format TradingAgent.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build TradingAgent.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test TradingAgent.slnx -c Release --no-build

      # Trim and AOT warnings are errors (TreatWarningsAsErrors), so this step is the AOT-compatibility gate.
      - name: Publish (Native AOT)
        run: dotnet publish src/TradingAgent.App/TradingAgent.App.csproj -c Release -r win-x64 --no-restore -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: trading-agent-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 7
