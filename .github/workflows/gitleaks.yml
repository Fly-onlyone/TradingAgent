name: Gitleaks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    # Mondays 04:00 UTC: full-history scan, catches rules added since the commit landed.
    - cron: "0 4 * * 1"

permissions:
  contents: read
  pull-requests: write # the action comments on the offending line of a PR

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks walks commit history; a shallow clone hides older commits

      # No GITLEAKS_LICENSE: the action only requires one for organization-owned repos.
      # Config and triaged findings are read from .gitleaks.toml and .gitleaksignore.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1 # keep in step with the rev in .pre-commit-config.yaml
