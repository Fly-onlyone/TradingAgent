version: 2

# The old app (Python backend, React frontend, Tauri shell) is being replaced by the native app in
# src/. Its ecosystems (uv, bun, cargo) are not watched any more: their update pull requests were
# noise for code that is going away. Put them back here if the old app must live longer.

updates:
  # Versions live in Directory.Packages.props; every project has a packages.lock.json.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(desktop)"
    groups:
      dotnet-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(ci)"
