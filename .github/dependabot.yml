version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(backend)"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(frontend)"
    groups:
      js-deps:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /frontend/src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(tauri)"
    groups:
      rust-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(ci)"
