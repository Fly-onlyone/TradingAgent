repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/src/routeTree\.gen\.ts$
      - id: end-of-file-fixer
        exclude: ^frontend/src/routeTree\.gen\.ts$
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig(\..+)?\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/biomejs/pre-commit
    rev: v0.6.1
    hooks:
      - id: biome-check
        files: ^frontend/
        exclude: ^frontend/src/routeTree\.gen\.ts$
        additional_dependencies: ["@biomejs/biome@2.2.4"]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --types
          - feat,fix,perf,refactor,docs,test,build,ci,chore,revert,style,deps
