[project]
name = "trading-agent"
version = "0.1.0"
description = "Automatic Trading agent Backend with Claude AI"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "anthropic>=0.94.0",
    "claude-agent-sdk>=0.1.58,<1.0.0",
    "python-okx>=0.4.1",
    # MongoDB
    "motor>=3.7.1",
    "beanie>=2.1.0",
    # Embeddings (local model)
    "sentence-transformers>=5.4.0",
    "einops>=0.8.2",
    # Process monitoring (game detection for embedding deferral)
    "psutil>=7.2.2",
    # Core
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-jose[cryptography]>=3.5.0",
    "cryptography>=46.0.7",
    "httpx>=0.28.1",
    # News Intelligence
    "feedparser>=6.0.12",
    "beautifulsoup4>=4.14.3",
    "trafilatura>=2.0.0",
    "apscheduler>=3.11.2",
    "tzlocal>=5.3.1",
    # Data Processing
    "ta>=0.11.0",
    "pandas>=3.0.2",
    "numpy>=2.4.4",
    "python-multipart>=0.0.26",
    # Direct transitive deps (imported directly in code)
    "starlette>=1.0.0",
    "pymongo>=4.16.0",
    "bcrypt>=5.0.0",
    # Error monitoring
    "sentry-sdk[fastapi]>=2.57.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Dev file watcher (used by run.py)
    "watchfiles>=1.1.1",
    "pandas-stubs~=3.0.0",
    # Strategy import (PDF + YAML parsing)
    "pymupdf>=1.27.2.2",
    "pyyaml>=6.0.3",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.2",
    "apprise>=1.9.9",
    # Cross-encoder re-ranking for RAG
    "flashrank>=0.2.10",
    # OS credential store (Windows Credential Manager / macOS Keychain / Linux Secret Service)
    "keyring>=25.7.0",
    # Windows desktop toast notifications
    "winotify>=1.1.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pyinstaller>=6.19.0",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
