[project]
name = "trading-agent"
version = "0.1.0"
description = "Automatic Trading agent Backend with Claude AI"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "anthropic>=0.103.1",
    "claude-agent-sdk>=0.2.82,<1.0.0",
    "openai>=1.50.0",
    "python-okx>=0.4.0",
    # MCP client — used by okx_atk.mcp_client to talk to the OKX Agent Trade Kit
    # stdio MCP server from the OpenAI runtime bridge and from server-side ATK tooling.
    "mcp>=1.27.1,<2.0.0",
    # MongoDB
    "motor>=3.6.0",
    "beanie>=2.1.0",
    # Embeddings (local model)
    "sentence-transformers>=5.5.0",
    "einops>=0.8.0",
    # Process monitoring (game detection for embedding deferral)
    "psutil>=5.9.0",
    # Core
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "cryptography>=48.0.0",
    "httpx>=0.27.0",
    # News Intelligence
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.6.0",
    "apscheduler>=3.10.0",
    "tzlocal>=5.0",
    # Data Processing
    "ta>=0.11.0",
    "pandas>=3.0.3",
    "numpy>=2.4.6",
    "python-multipart>=0.0.29",
    # Direct transitive deps (imported directly in code)
    "starlette>=1.0.0",
    "pymongo>=4.17.0",
    "bcrypt>=4.0.0",
    # Error monitoring
    "sentry-sdk[fastapi]>=2.60.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Dev file watcher (used by run.py)
    "watchfiles>=1.2.0",
    "pandas-stubs~=3.0.0",
    # Strategy import (PDF + YAML parsing)
    "pymupdf>=1.27.2.3",
    "pyyaml>=6.0.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.2",
    "apprise>=1.10.0",
    # Cross-encoder re-ranking for RAG
    "flashrank>=0.2.0",
    # OS credential store (Windows Credential Manager / macOS Keychain / Linux Secret Service)
    "keyring>=25.0.0",
    # Windows desktop toast notifications
    "winotify>=1.1.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "pyinstaller>=6.20.0",
    "ruff>=0.15.13",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
