[project]
name = "trading-agent"
version = "0.1.0"
description = "Automatic Trading Agent Backend with Claude AI"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "anthropic>=0.40.0",
    "claude-agent-sdk>=0.1.0,<1.0.0",
    "python-okx>=0.4.0",
    # MongoDB
    "motor>=3.6.0",
    "beanie>=1.26.0",
    # Embeddings (local model)
    "sentence-transformers>=5.0.0",
    "einops>=0.8.0",
    # Process monitoring (game detection for embedding deferral)
    "psutil>=5.9.0",
    # Core
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    # News Intelligence
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.6.0",
    "apscheduler>=3.10.0",
    # Data Processing
    "ta>=0.11.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    # Direct transitive deps (imported directly in code)
    "starlette>=0.30.0",
    "pymongo>=4.6.0",
    "bcrypt>=4.0.0",
    # Error monitoring
    "sentry-sdk[fastapi]>=2.0.0",
    # Dev file watcher (used by run.py)
    "watchfiles>=0.20.0",
    "pandas-stubs~=3.0.0",
    # Strategy import (PDF + YAML parsing)
    "pymupdf>=1.24.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
